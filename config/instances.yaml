---
litemaas:
  models:
    - minimax-m2
  duration: 1d
  enable_user_info_messages: true
  enable_user_info_data: true

containers: []
virtualmachines:
  - name: "host1"
    image: "rhel-9.5"
    memory: "2G"
    cores: 1
    image_size: "40G"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
    networks:
      - default
      - secondary

